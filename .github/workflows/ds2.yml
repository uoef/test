name: Mirror ds2api

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 源镜像
        required: true
        default: ghcr.io/ouqiting/ds2api:v3.7.0
      target_tag:
        description: 推到自己仓库的标签
        required: true
        default: v3.7.0
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/mirror.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ds2api

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy multi-arch image
        run: |
          set -euo pipefail
          SRC="${{ github.event.inputs.source_image || 'ghcr.io/ouqiting/ds2api:v3.7.0' }}"
          TAG="${{ github.event.inputs.target_tag || 'v3.7.0' }}"
          DEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          echo "source = ${SRC}"
          echo "dest   = ${DEST}"

          docker buildx imagetools create \
            --tag "${DEST}" \
            --tag "${LATEST}" \
            "${SRC}"

          docker buildx imagetools inspect "${DEST}"
