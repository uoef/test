name: Build image

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: "Source image"
        required: true
        default: "ghcr.io/ouqiting/ds2api:v3.7.0"
      image_name:
        description: "Image name. Leave empty to use the repo name."
        required: false
        default: ""
      version:
        description: "Version tag to keep"
        required: true
        default: "v3.7.0"
      update_latest:
        description: "Also update latest"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve names
        id: meta
        env:
          INPUT_NAME: ${{ inputs.image_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          HAS_TOKEN: ${{ secrets.GHCR_TOKEN != '' }}
        run: |
          set -euo pipefail

          NAME="$(printf '%s' "${INPUT_NAME}" | tr '[:upper:]' '[:lower:]' | xargs || true)"
          REPO="$(printf '%s' "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')"
          OWNER="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${INPUT_VERSION}"
          RUN_TAG="${VERSION}-run.${GITHUB_RUN_NUMBER}"

          if [ -z "${NAME}" ]; then
            NAME="${REPO}"
          fi

          if [ "${NAME}" != "${REPO}" ] && [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::Current repo is ${OWNER}/${REPO}, GITHUB_TOKEN cannot push ghcr.io/${OWNER}/${NAME}"
            echo "::error::Leave image_name empty, rename the repo, or add secret GHCR_TOKEN"
            exit 1
          fi

          BASE="ghcr.io/${OWNER}/${NAME}"

          {
            echo "name=${NAME}"
            echo "base=${BASE}"
            echo "version=${VERSION}"
            echo "run_tag=${RUN_TAG}"
            echo "use_pat=${HAS_TOKEN}"
          } >> "${GITHUB_OUTPUT}"

          echo "push ${BASE}:${VERSION}"
          echo "keep ${BASE}:${RUN_TAG}"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.meta.outputs.use_pat == 'true' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            SOURCE_IMAGE=${{ inputs.source_image }}
          tags: |
            ${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.run_tag }}
            ${{ inputs.update_latest && format('{0}:latest', steps.meta.outputs.base) || '' }}
