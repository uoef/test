name: Mirror ds2api

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 源镜像
        required: true
        default: ghcr.io/ouqiting/ds2api:v3.7.0
      target_tag:
        description: 推到自己仓库的标签
        required: true
        default: v3.7.0

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Copy image unchanged
        run: |
          set -euo pipefail
          SRC="${{ github.event.inputs.source_image }}"
          TAG="${{ github.event.inputs.target_tag }}"
          DEST="ghcr.io/${{ github.repository_owner }}/ds2api:${TAG}"
          LATEST="ghcr.io/${{ github.repository_owner }}/ds2api:latest"

          echo "source = ${SRC}"
          echo "dest   = ${DEST}"

          # --all = 完整复制多架构清单，层内容不变
          skopeo copy --all \
            "docker://${SRC}" \
            "docker://${DEST}"

          skopeo copy --all \
            "docker://${DEST}" \
            "docker://${LATEST}"

          echo "==== dest inspect ===="
          skopeo inspect --raw "docker://${DEST}" | jq '{schemaVersion,mediaType,manifests:[.manifests[]?|{digest,platform}]}'
