name: Mirror ds2api

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 源镜像
        required: true
        default: ghcr.io/ouqiting/ds2api:v3.7.0
      target_tag:
        description: 推到自己仓库的标签
        required: true
        default: v3.7.0

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ds2api

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy linux/amd64 + linux/arm64
        run: |
          set -euo pipefail
          SRC="${{ github.event.inputs.source_image }}"
          TAG="${{ github.event.inputs.target_tag }}"
          DEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          echo "source = ${SRC}"
          echo "dest   = ${DEST}"

          mapfile -t REFS < <(
            docker buildx imagetools inspect --raw "${SRC}" \
              | jq -r --arg src "${SRC}" '
                  .manifests[]
                  | select(.platform.os == "linux")
                  | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                  | "\($src)@" + .digest
                '
          )

          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "没有解析到 linux/amd64 或 linux/arm64"
            docker buildx imagetools inspect "${SRC}"
            exit 1
          fi

          printf 'copying:\n'
          printf '  %s\n' "${REFS[@]}"

          docker buildx imagetools create \
            --tag "${DEST}" \
            --tag "${LATEST}" \
            "${REFS[@]}"

          docker buildx imagetools inspect "${DEST}"
